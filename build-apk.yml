name: Build SafarGo Captain APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project shell
        run: flutter create --platforms=android buildapp
      - name: Copy SafarGo Captain source
        run: |
          cp pubspec.yaml buildapp/pubspec.yaml
          rm -rf buildapp/lib
          cp -r lib buildapp/lib
      - name: Get dependencies
        working-directory: buildapp
        run: flutter pub get
      - name: Build release APK
        working-directory: buildapp
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safargo-captain-apk
          path: buildapp/build/app/outputs/flutter-apk/app-release.apk
